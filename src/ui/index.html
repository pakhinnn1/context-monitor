<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="color-scheme" content="light dark" />
    <title>Context</title>
    <style>/* __INLINE_CSS__ */</style>
  </head>
  <body>
    <main class="panel" id="app" aria-busy="true">
      <header class="header">
        <div class="header-left">
          <h1 class="title">Context</h1>
        </div>
        <div class="header-actions" aria-hidden="true">
          <span class="skel skel-icon"></span>
          <span class="skel skel-icon"></span>
        </div>
      </header>
      <div class="skeleton-panel" aria-hidden="true">
        <div class="thread-bar">
          <div class="skel skel-select"></div>
          <div class="skel skel-meta"></div>
        </div>
        <div class="usage-block">
          <div class="usage-summary">
            <span class="skel skel-hero"></span>

        <div class="rows">

          <div class="skel-row"><span class="skel skel-swatch"></span><span class="skel skel-label skel-w-lg"></span><span class="skel skel-val"></span></div>
          <div class="skel-row"><span class="skel skel-swatch"></span><span class="skel skel-label skel-w-sm"></span><span class="skel skel-val"></span></div>
        </div>
        <div class="drawers">
          <div class="skel skel-drawer"></div>
          <div class="skel skel-drawer"></div>
          <div class="skel skel-drawer"></div>
        </div>
      </div>
    </main>
    <div id="status-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module">/* __INLINE_JS__ */</script>
  </body>
</html>
